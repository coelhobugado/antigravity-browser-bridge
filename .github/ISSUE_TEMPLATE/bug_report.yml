name: Bug report
description: Report a reproducible problem in the bridge, extension, native host or MCP tools
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove cookies, tokens, private messages and personal browser data before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - MCP tools
        - Native host
        - Chrome extension
        - Installer or diagnostics
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-beta.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start...
        2. Authorize...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Chrome channel/version, Node, pnpm, Rust and MCP client
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, cookies, tokens and private data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true